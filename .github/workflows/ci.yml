name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore BitwardenDecrypt.Tests/BitwardenDecrypt.Tests.csproj --verbosity minimal

      - name: Build and test
        shell: bash
        run: |
          status=0
          dotnet test BitwardenDecrypt.Tests/BitwardenDecrypt.Tests.csproj --configuration Release --no-restore --nologo --verbosity minimal > test.log 2>&1 || status=$?
          cat test.log
          if [ "$status" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          message = Path("test.log").read_text()[-6000:]
          for start in range(0, len(message), 1500):
              chunk = message[start:start + 1500]
              chunk = chunk.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error::{chunk}")
          PY
            exit "$status"
          fi
